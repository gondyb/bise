[package]
name = "bend-tui"
version = "1.0.0"
edition = "2021"
description = "Ratatui terminal UI for the Bend Unified Harness (Rust port of repl-tui)."

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
unicode-segmentation = "1"
serde_json = "1"
# speech-to-text (voice.rs): the microphone, the realtime websocket
cpal = "0.15"
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.22"
