[package]
name = "bend-tui"
version = "1.0.0"
edition = "2021"
description = "Ratatui terminal UI for the Bend Unified Harness (Rust port of repl-tui)."

[dependencies]
bend-plugins = { path = "../plugins" }
bend-images = { path = "../images" }
ratatui = "0.29"
# the embedded terminal (term.rs): a PTY, a vt100 parser, its ratatui widget
tui-term = "0.2"
vt100 = "0.15"
portable-pty = "0.9"
crossterm = "0.28"
unicode-width = "0.2"
unicode-segmentation = "1"
serde_json = "1"
# speech-to-text (voice.rs): the microphone, the realtime websocket
cpal = "0.15"
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.22"
ignore = "0.4"
nucleo-matcher = "0.3.1"
memchr = "2.8.3"
