# bise's built-in model catalog (BISE-142). Read by Rust (rust/catalog),
# compiled into the binary: no network, no third-party service.
#
# Edit by hand. The same two tables work in ~/.bise/config.toml, where
# they add or override entries key by key:
#
#   [providers.<id>]      name, api, base_url, key_env, needs,
#                         + defaults for its models (the fields below)
#   [models."<id>/<model>"]  context, max_output, vision, reasoning, tools
#
# api (the wire family): openai-chat | anthropic | openai-responses |
#   gemini | bedrock-converse. Today the Bend runtime speaks openai-chat
#   and anthropic; the others come with BISE-147/148/149.
# key_env = "" : no key needed (local servers).
# needs = "BISE-149" : listed, not usable yet (cloud auth).
# A model field not set comes from its provider, then from the defaults:
#   context 128000, max_output 16384, vision false, reasoning false,
#   tools true.
# Any "<provider>/<model>" works even when the model is not listed here:
# it gets its provider's defaults. Model ids may hold '/': the provider
# is the part before the FIRST '/'.
# Checked by hand against the providers' docs; last update 2025-11.

# no model in config.toml and no BISE_MODEL / BEND_MODEL: this one
default_model = "foundry/claude-opus-5-5"

# names without a provider (the old config lines keep working)
[aliases]
"opus-5.5" = "foundry/claude-opus-5-5"

# ---- Anthropic ----

[providers.anthropic]
name = "Anthropic"
api = "anthropic"
base_url = "https://api.anthropic.com/v1"
key_env = "ANTHROPIC_API_KEY"
context = 200000
max_output = 32000
vision = true
reasoning = true

[models."anthropic/claude-opus-4-5"]
max_output = 64000

[models."anthropic/claude-sonnet-4-5"]
max_output = 64000

[models."anthropic/claude-haiku-4-5"]
max_output = 64000

# the user's Anthropic proxy (the setup before BISE-142); the harness
# sends the 1M-context beta header, so 1M
[providers.foundry]
name = "Anthropic (foundry proxy)"
api = "anthropic"
base_url = "https://foundry-proxy.cheetah-koi.ts.net/anthropic/v1"
key_env = "ANTHROPIC_FOUNDRY_API_KEY"
context = 1000000
max_output = 32768
vision = true
reasoning = true

[models."foundry/claude-opus-5-5"]

