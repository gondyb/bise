# bise's built-in model catalog (BISE-142). Read by Rust (rust/catalog),
# compiled into the binary: no network, no third-party service.
#
# Edit by hand. The same two tables work in ~/.bise/config.toml, where
# they add or override entries key by key:
#
#   [providers.<id>]      name, api, base_url, key_env, needs,
#                         + defaults for its models (the fields below)
#   [models."<id>/<model>"]  context, max_output, vision, reasoning, tools
#
# api (the wire family): openai-chat | anthropic | openai-responses |
#   gemini | bedrock-converse. Today the Bend runtime speaks openai-chat
#   and anthropic; the others come with BISE-147/148/149.
# key_env = "" : no key needed (local servers).
# needs = "BISE-149" : listed, not usable yet (cloud auth).
# small_model = "<id>" : a cheap model of the provider for short labels
#   (the agents' role lines, BISE-126); config `small_model` wins.
# A model field not set comes from its provider, then from the defaults:
#   context 128000, max_output 16384, vision false, reasoning false,
#   tools true.
# Anthropic family only (BISE-146): thinking = "adaptive" | "budget" |
#   "none" (unset: adaptive when the model reasons, none otherwise);
#   betas = the anthropic-beta header (unset: the foundry proxy's list).
#   max_output is the body's max_tokens.
# Reasoning effort (BISE-135), for a model that reasons: efforts = the
#   words it takes, comma-separated (unset: its family's: anthropic
#   none,low,medium,high,max; the others none,low,medium,high);
#   effort = the one it gets when nobody picks (unset: high). /reasoning
#   and config.toml's reasoning_effort / agent_reasoning_effort pick.
# Prices (BISE-150), USD per million tokens: input_price, output_price,
#   cache_read_price, cache_write_price (the two cache ones default to
#   input_price). Unset: the cost is not shown. The list prices, short
#   prompts (a long-context tier costs more).
# Any "<provider>/<model>" works even when the model is not listed here:
# it gets its provider's defaults. Model ids may hold '/': the provider
# is the part before the FIRST '/'.
# Speech to text (BISE-130): stt = "<family>" on a provider that
#   transcribes (mistral | openai | elevenlabs | deepgram: the wire
#   format), kind = "stt" on a provider or a model that only transcribes
#   (not a chat model). config.toml's [voice] picks one: model,
#   language (unset: detected), vocabulary (words to spell right).
# The first run's key step (BISE-266), per provider: hint (a few words),
#   keys_url (where a key is made), signup_url (only when not the keys
#   page), model (the id a new user starts with), hidden = true (not
#   offered: a private proxy). Checked 2026-09-30 against each provider's
#   docs and keys page.
# Checked by hand against the providers' docs; last update 2025-11.

# no default_model (BISE-266): with no model in config.toml and no
# BISE_MODEL / BEND_MODEL, bise has no model and sends nothing; the first
# run's key step picks one from a key it has checked. A config.toml can
# still set default_model.

# the voice input's model (BISE-130) when config.toml's [voice] has none
default_voice_model = "mistral/voxtral-mini-latest"

# names without a provider (the old config lines keep working)
[aliases]
"opus-5.5" = "foundry/claude-opus-5-5"

# ---- Anthropic ----

[providers.anthropic]
name = "Anthropic"
hint = "Claude, by Anthropic"
keys_url = "https://platform.claude.com/settings/keys"
model = "claude-opus-5-5"
api = "anthropic"
base_url = "https://api.anthropic.com/v1"
key_env = "ANTHROPIC_API_KEY"
small_model = "claude-haiku-4-5"
context = 200000
max_output = 32000
vision = true
reasoning = true
# extended thinking with a token budget (the 4.5 models reject adaptive
# thinking: "adaptive thinking is not supported on this model"); the
# beta flags these models take (no 1M context: it needs its own tier)
thinking = "budget"
betas = "interleaved-thinking-2025-05-14,fine-grained-tool-streaming-2025-05-14"

# the 5.5 models think adaptively (checked 2026-09 on
# platform.claude.com/docs/en/about-claude/models/overview); 1M context
# needs its own tier: 200k here
[models."anthropic/claude-opus-5-5"]
thinking = "adaptive"
max_output = 64000
input_price = 4
output_price = 20

[models."anthropic/claude-sonnet-5-5"]
thinking = "adaptive"
max_output = 64000
input_price = 2
output_price = 10

[models."anthropic/claude-opus-4-5"]
max_output = 64000
input_price = 5
output_price = 25
cache_read_price = 0.5
cache_write_price = 6.25

[models."anthropic/claude-sonnet-4-5"]
max_output = 64000
input_price = 3
output_price = 15
cache_read_price = 0.3
cache_write_price = 3.75

[models."anthropic/claude-haiku-4-5"]
max_output = 64000
input_price = 1
output_price = 5
cache_read_price = 0.1
cache_write_price = 1.25

# the user's Anthropic proxy (the setup before BISE-142); the harness
# sends the 1M-context beta header, so 1M
[providers.foundry]
name = "Anthropic (foundry proxy)"
hidden = true
api = "anthropic"
base_url = "https://foundry-proxy.cheetah-koi.ts.net/anthropic/v1"
key_env = "ANTHROPIC_FOUNDRY_API_KEY"
