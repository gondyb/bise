[package]
name = "bend-harness"
version = "0.1.0"
edition = "2021"
license.workspace = true

# the command is `bise` (BISE-165); the package keeps its name (cargo -p
# bend-harness). Version dirs and installs also get a `bend-harness` link
# to it, for one release.
[[bin]]
name = "bise"
path = "src/main.rs"

[dependencies]
bise-catalog = { path = "../catalog" }
bise-home = { path = "../home" }
bise-session = { path = "../session" }
bend-plugins = { path = "../plugins" }
bise-computer-use = { path = "../computer-use" }
bend-tui = { path = "../tui" }
switchboard = { path = "../switchboard" }
serde_json = "1"
