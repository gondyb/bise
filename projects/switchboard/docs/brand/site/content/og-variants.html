<h1 data-a="title">the share image · 4 variants</h1>
<p class="dim">what people see when bise.dev is shared (1200×630). hover a block to annotate it, as usual. the small row at the bottom is the size most feeds show.</p>
<div class="grid">
<figure data-a="og-a"><img src="og/og-a.png"><figcaption><b>a · the gloss</b> <span class="dim">(live now) the definition, then what it is. no wind.</span></figcaption></figure>
<figure data-a="og-b"><img src="og/og-b.png"><figcaption><b>b · the promise</b> <span class="dim">"talk to one agent. it runs the team. you stay in flow." the clearest for a stranger. (live now: the user's pick)</span></figcaption></figure>
<figure data-a="og-c"><img src="og/og-c.png"><figcaption><b>c · show it</b> <span class="dim">a slice of the demo: OK LAST ONE, the dog with a hat. says "product" at a glance. my pick.</span></figcaption></figure>
