<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" role="img" aria-label="a card asks one question; you answer with one key; it folds into one line."><style>text{font-family:ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace;} @media (prefers-reduced-motion: reduce){*{animation:none!important}}@keyframes k1{0%,6.00%{opacity:0}9.50%,92.00%{opacity:1}95.50%,100%{opacity:0}}.k1{opacity:0;animation:k1 10s linear infinite}@keyframes k2{0%,14.00%{opacity:0}16.00%,52.00%{opacity:1}54.00%,100%{opacity:0}}.k2{opacity:0;animation:k2 10s linear infinite}@keyframes k3{0%,52.00%{opacity:0}54.00%,92.00%{opacity:1}94.00%,100%{opacity:0}}.k3{opacity:0;animation:k3 10s linear infinite}@keyframes k4{0%,46.00%{opacity:0}47.00%,52.00%{opacity:1}53.00%,100%{opacity:0}}.k4{opacity:0;animation:k4 10s linear infinite}@keyframes k5{0%,60.00%{opacity:0}63.50%,92.00%{opacity:1}95.50%,100%{opacity:0}}.k5{opacity:0;animation:k5 10s linear infinite}@keyframes g{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}.g{animation:g 1.2s infinite}</style><rect width="680" height="230" rx="12" fill="#f7f4ee" stroke="#e2dbcf"/><text x="656" y="30" text-anchor="end" font-size="12" fill="#77706a">ctrl+g opens the inbox</text><text class="k1" x="28" y="44" font-size="14" fill="#1b1917" xml:space="preserve"><tspan fill="#b8416b">:*</tspan> perf found why signup is slow.</text><g class="k2"><rect x="14" y="60" width="620" height="72" rx="4" fill="#efe9df"/><rect x="14" y="60" width="3" height="72" fill="#b8416b"/><text x="28" y="77" font-size="14" font-weight="700" fill="#b8416b">? perf needs you</text><text x="28" y="99" font-size="14" fill="#1b1917">the hero image is 4.2 MB. compress it, or lazy-load it?</text><text x="28" y="121" font-size="13" fill="#77706a" xml:space="preserve">1 compress   2 lazy-load   3 both</text></g><text class="k3" x="28" y="77" font-size="14" fill="#77706a"><tspan fill="#b8416b">✓</tspan> perf · you said both</text><rect class="k4" x="240" y="107" width="65" height="20" rx="3" fill="#e4ddd2"/><text class="k5" x="28" y="115" font-size="14" fill="#1b1917" xml:space="preserve"><tspan fill="#b8416b">✓</tspan> perf done <tspan fill="#77706a">· signup 4.1 s → 0.9 s</tspan></text></svg>
