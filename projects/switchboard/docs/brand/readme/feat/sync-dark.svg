<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" role="img" aria-label="two agents message each other about a shared file, then main sums it up in one line."><style>text{font-family:ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace;} @media (prefers-reduced-motion: reduce){*{animation:none!important}}@keyframes k1{0%,10.00%{opacity:0}13.50%,92.00%{opacity:1}95.50%,100%{opacity:0}}.k1{opacity:0;animation:k1 10s linear infinite}@keyframes k2{0%,10.00%{opacity:0}13.50%,92.00%{opacity:1}95.50%,100%{opacity:0}}.k2{opacity:0;animation:k2 10s linear infinite}@keyframes k3{0%,26.00%{opacity:0}29.50%,92.00%{opacity:1}95.50%,100%{opacity:0}}.k3{opacity:0;animation:k3 10s linear infinite}@keyframes k4{0%,26.00%{opacity:0}29.50%,92.00%{opacity:1}95.50%,100%{opacity:0}}.k4{opacity:0;animation:k4 10s linear infinite}@keyframes k5{0%,44.00%{opacity:0}47.50%,92.00%{opacity:1}95.50%,100%{opacity:0}}.k5{opacity:0;animation:k5 10s linear infinite}@keyframes k6{0%,50.00%{opacity:0}53.50%,92.00%{opacity:1}95.50%,100%{opacity:0}}.k6{opacity:0;animation:k6 10s linear infinite}@keyframes g{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}.g{animation:g 1.2s infinite}</style><rect width="680" height="230" rx="12" fill="#141211" stroke="#2c2825"/><text x="656" y="30" text-anchor="end" font-size="12" fill="#8f887d">between agents · folded by default</text><g class="k2"><rect x="24" y="36" width="162" height="20" rx="4" fill="#2a2522"/><text x="32" y="50" font-size="12" fill="#8f887d" xml:space="preserve">✉ <tspan font-weight="700" fill="#ece6da">dark-mode</tspan> <tspan fill="#3d3935">→</tspan> theme</text><text x="40" y="72" font-size="13" fill="#8f887d">which file has the colors?</text></g><g class="k4"><rect x="24" y="86" width="162" height="20" rx="4" fill="#2a2522"/><text x="32" y="100" font-size="12" fill="#8f887d" xml:space="preserve">✉ <tspan font-weight="700" fill="#ece6da">theme</tspan> <tspan fill="#3d3935">→</tspan> dark-mode</text><text x="40" y="122" font-size="13" fill="#8f887d">tokens.css. i&#x27;m editing it, don&#x27;t touch it.</text></g><text class="k5" x="28" y="154" font-size="14" fill="#ece6da" xml:space="preserve"><tspan fill="#f4a6b0">:*</tspan> dark-mode and theme agreed on who edits tokens.css.</text><text class="k6" x="28" y="181" font-size="13" fill="#ece6da" xml:space="preserve"><tspan fill="#8f887d">you didn’t have to do anything.</tspan></text></svg>
