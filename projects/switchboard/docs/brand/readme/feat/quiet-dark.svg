,93.33%{opacity:1}96.25%,100%{opacity:0}}.k13{opacity:0;animation:k13 12s linear infinite}@keyframes k14{0%,2.50%{opacity:0}5.42%,93.33%{opacity:1}96.25%,100%{opacity:0}}.k14{opacity:0;animation:k14 12s linear infinite}@keyframes g{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}.g{animation:g 1.2s infinite}</style><rect width="680" height="250" rx="12" fill="#141211" stroke="#2c2825"/><text x="656" y="30" text-anchor="end" font-size="12" fill="#8f887d">ctrl+o opens it all · ctrl+o folds it back</text><text class="k1" x="28" y="44" font-size="14" fill="#ece6da" xml:space="preserve"><tspan fill="#f4a6b0">:*</tspan> perf and theme are on it.</text><text class="k2" x="28" y="71" font-size="14" fill="#ece6da" xml:space="preserve"><tspan fill="#3d3935">▸</tspan> <tspan fill="#8f887d">3 folded · tool calls and messages between agents</tspan></text><text class="k3" x="28" y="71" font-size="14" fill="#ece6da" xml:space="preserve"><tspan fill="#3d3935">▸</tspan> <tspan fill="#8f887d">7 folded · tool calls and messages between agents</tspan></text><text class="k4" x="28" y="71" font-size="14" fill="#ece6da" xml:space="preserve"><tspan fill="#3d3935">▸</tspan> <tspan fill="#8f887d">12 folded · tool calls and messages between agents</tspan></text><g class="k5"><rect x="588" y="56" width="64" height="20" rx="3" fill="#2a2522"/><text x="620" y="71" text-anchor="middle" font-size="12" fill="#ece6da">ctrl+o</text></g><text class="k6" x="28" y="71" font-size="13" fill="#ece6da" xml:space="preserve"><tspan fill="#f4a6b0">✉</tspan> perf <tspan fill="#8f887d">→</tspan> theme <tspan fill="#8f887d">· which file has the colors?</tspan></text><text class="k7" x="28" y="98" font-size="13" fill="#ece6da" xml:space="preserve"><tspan fill="#8f887d">ƒ</tspan> reading the Lighthouse report <tspan fill="#f4a6b0">✓</tspan></text><text class="k8" x="28" y="125" font-size="13" fill="#ece6da" xml:space="preserve"><tspan fill="#f4a6b0">✉</tspan> theme <tspan fill="#8f887d">→</tspan> perf <tspan fill="#8f887d">· tokens.css. i’m on it, don’t touch it</tspan></text><text class="k9" x="28" y="152" font-size="13" fill="#ece6da" xml:space="preserve"><tspan fill="#8f887d">$</tspan> npm run build <tspan fill="#f4a6b0">✓</tspan></text><text class="k10" x="28" y="179" font-size="13" fill="#ece6da" xml:space="preserve"><tspan fill="#8f887d">$</tspan> running the signup test <tspan fill="#f4a6b0">✓</tspan></text><g class="k11"><rect x="588" y="56" width="64" height="20" rx="3" fill="#2a2522"/><text x="620" y="71" text-anchor="middle" font-size="12" fill="#ece6da">ctrl+o</text></g><text class="k12" x="28" y="71" font-size="14" fill="#ece6da" xml:space="preserve"><tspan fill="#3d3935">▸</tspan> <tspan fill="#8f887d">12 folded · tool calls and messages between agents</tspan></text><text class="k13" x="28" y="98" font-size="14" fill="#ece6da" xml:space="preserve"><tspan fill="#f4a6b0">✓</tspan> perf done <tspan fill="#8f887d">· signup 4.1 s → 0.9 s</tspan></text><text class="k14" x="28" y="228" font-size="13" fill="#ece6da" xml:space="preserve"><tspan fill="#8f887d">what matters to you shows. the rest is one key away, in full.</tspan></text></svg>
