2" font-size="12" fill="#d6cfc4">⏎ send · @ agent · ⌥0-9 switch · ctrl+o open all · ? help</text><text class="k2" x="24" y="472" font-size="15" fill="#d6cfc4">what's on your mind?</text><clipPath id="c4"><rect class="r3" x="24" y="450" height="30" width="0"/></clipPath><g class="k4"><text x="24" y="472" font-size="15" fill="#1b1917" clip-path="url(#c4)">fix the flaky login test, and draft the 2.4 release note</text></g><g class="k5"><rect x="24" y="57" width="3" height="19" fill="#b8416b"/><text x="40" y="72" font-size="14" font-weight="700" fill="#1b1917">fix the flaky login test, and draft the 2.4 release note</text></g><text class="k6" x="40" y="93" font-size="14" fill="#1b1917" xml:space="preserve"><tspan fill="#b8416b">:*</tspan> on it. auth-fix takes the test, release takes the note.</text><text class="k7" x="700" y="126" font-size="14" fill="#77706a" xml:space="preserve">1 <tspan class="g" fill="#b8416b">∿</tspan> <tspan fill="#1b1917">auth-fix</tspan></text><rect class="k8" x="712" y="112" width="12" height="18" fill="#f7f4ee"/><text class="k8" x="713" y="126" font-size="14" fill="#b8416b">✓</text><text class="k9" x="700" y="150" font-size="14" fill="#77706a" xml:space="preserve">2 <tspan class="g" fill="#b8416b">∿</tspan> <tspan fill="#1b1917">release</tspan></text><rect class="k10" x="712" y="136" width="12" height="18" fill="#f7f4ee"/><text class="k10" x="713" y="150" font-size="14" fill="#b8416b">✓</text><clipPath id="c12"><rect class="r11" x="24" y="450" height="30" width="0"/></clipPath><g class="k12"><text x="24" y="472" font-size="15" fill="#1b1917" clip-path="url(#c12)">oh, and move the api client to v3</text></g><g class="k13"><rect x="24" y="120" width="3" height="19" fill="#b8416b"/><text x="40" y="135" font-size="14" font-weight="700" fill="#1b1917">oh, and move the api client to v3</text></g><text class="k14" x="40" y="156" font-size="14" fill="#1b1917" xml:space="preserve"><tspan fill="#b8416b">:*</tspan> sure. api-bump is on it.</text><text class="k15" x="700" y="174" font-size="14" fill="#77706a" xml:space="preserve">3 <tspan class="g" fill="#b8416b">∿</tspan> <tspan fill="#1b1917">api-bump</tspan></text><g class="k16"><rect x="38" y="177" width="196" height="20" rx="3" fill="#e4ddd2"/><text x="46" y="192" font-size="13" fill="#77706a" xml:space="preserve">✉ <tspan font-weight="700" fill="#1b1917">auth-fix</tspan> <tspan fill="#d6cfc4">→</tspan> api-bump</text><text x="58" y="213" font-size="13" fill="#77706a">i&#x27;m in session.ts for 2 min. start with the client?</text></g><g class="k17"><rect x="38" y="219" width="196" height="20" rx="3" fill="#e4ddd2"/><text x="46" y="234" font-size="13" fill="#77706a" xml:space="preserve">✉ <tspan font-weight="700" fill="#1b1917">api-bump</tspan> <tspan fill="#d6cfc4">→</tspan> auth-fix</text><text x="58" y="255" font-size="13" fill="#77706a">sure, client first.</text></g><g class="k18"><rect x="24" y="275" width="600" height="48" rx="4" fill="#efe9df"/><rect x="24" y="275" width="3" height="48" fill="#b8416b"/><text x="40" y="291" font-size="14" fill="#1b1917"><tspan fill="#b8416b" font-weight="700">?</tspan> release: v3 changes two public types. 2.4 or 3.0?</text><text x="40" y="313" font-size="13" fill="#77706a"><tspan fill="#b8416b">1</tspan> 2.4   <tspan fill="#b8416b">2</tspan> 3.0 · you press 2</text></g><text class="k19" x="40" y="347" font-size="14" fill="#1b1917" xml:space="preserve"><tspan fill="#b8416b">✓</tspan> auth-fix done <tspan fill="#77706a">· it was a race. it's always a race.</tspan></text><text class="k20" x="40" y="368" font-size="14" fill="#1b1917" xml:space="preserve"><tspan fill="#b8416b">✓</tspan> release done <tspan fill="#77706a">· 3.0 notes drafted.</tspan></text></svg>
