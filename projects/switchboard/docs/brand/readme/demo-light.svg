then the rest.</text><g class="k7"><rect x="24" y="157" width="3" height="19" fill="#b8416b"/><text x="40" y="172" font-size="14" font-weight="700" fill="#1b1917" xml:space="preserve">and the 404 page is so sad. make it less sad <tspan font-weight="400" fill="#d6cfc4">✓</tspan></text></g><text class="k8" x="420" y="172" font-size="14" fill="#b8416b">✓✓</text><text class="k9" x="40" y="193" font-size="14" fill="#1b1917" xml:space="preserve"><tspan fill="#b8416b">:*</tspan> cheering it up. sad-404 started.</text><g class="k10"><rect x="24" y="205" width="3" height="19" fill="#b8416b"/><text x="40" y="220" font-size="14" font-weight="700" fill="#1b1917" xml:space="preserve">wait also the csv export crashes on emoji 😭 <tspan font-weight="400" fill="#d6cfc4">✓</tspan></text></g><text class="k11" x="411" y="220" font-size="14" fill="#b8416b">✓✓</text><text class="k12" x="40" y="241" font-size="14" fill="#1b1917" xml:space="preserve"><tspan fill="#b8416b">:*</tspan> emoji-csv is on it. it&#x27;s always unicode.</text><g class="k13"><rect x="24" y="253" width="3" height="19" fill="#b8416b"/><text x="40" y="268" font-size="14" font-weight="700" fill="#1b1917" xml:space="preserve">OK LAST ONE. release notes for all of this <tspan font-weight="400" fill="#d6cfc4">✓</tspan></text></g><text class="k14" x="403" y="268" font-size="14" fill="#b8416b">✓✓</text><text class="k15" x="40" y="289" font-size="14" fill="#1b1917" xml:space="preserve"><tspan fill="#b8416b">:*</tspan> release waits for the others, then writes them. go get a coffee.</text><text class="k16" x="40" y="316" font-size="13" fill="#77706a" xml:space="preserve">▸ 9 messages between 5 agents</text><text class="k17" x="40" y="337" font-size="14" fill="#1b1917" xml:space="preserve"><tspan fill="#b8416b">:*</tspan> dark-mode asked which gray. i said the one in tokens.css.</text><g class="k18"><rect x="24" y="349" width="3" height="19" fill="#b8416b"/><text x="40" y="364" font-size="14" font-weight="700" fill="#1b1917" xm