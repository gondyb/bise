<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bise :* — design system</title>
<meta name="description" content="the bise design system: the laws, foundations, components and UX patterns behind every screen of a terminal app for multi-agent coding.">
<link rel="canonical" href="https://bise.dev/design/">
<meta name="theme-color" content="#141211">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="bise">
<meta property="og:url" content="https://bise.dev/design/">
<meta property="og:title" content="bise :* · design system">
<meta property="og:description" content="the laws, foundations, components and UX patterns behind every screen of bise.">
<meta property="og:image" content="https://bise.dev/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root,[data-theme="dark"]{
  --bg:#141211;--bg2:#1b1816;--text:#ece6da;--dim:#a39c90;--faint:#857d72;--line:#2a2623;--rule:#4a4540;
  --acc:#f4a6b0;--err:#ff5a52;--ok:#b9d99a;--tint:#2b1c21;
  /* the TUI's palette, for the mocks */
  --t-bg:#141211;--t-text:#ece6da;--t-dim:#a39c90;--t-faint:#857d72;--t-rule:#4a4540;--t-acc:#f4a6b0;--t-err:#ff5a52;--t-ok:#b9d99a;
  --t-raised:#1f1c1a;--t-raised2:#26221f;--t-chip:#231f1d;--t-sel:#33292c;--t-frame:#2a2623}
[data-theme="light"]{
  --bg:#f7f4ee;--bg2:#efeae1;--text:#1b1917;--dim:#6b645a;--faint:#7d766c;--line:#e2dcd2;--rule:#cfc8bd;
  --acc:#b8416b;--err:#b3261e;--ok:#3f7a2a;--tint:#f6e3e8;
  --t-bg:#fdfbf7;--t-text:#1b1917;--t-dim:#6b645a;--t-faint:#7d766c;--t-rule:#cfc8bd;--t-acc:#b8416b;--t-err:#b3261e;--t-ok:#3f7a2a;
  --t-raised:#f4f0e8;--t-raised2:#efeae0;--t-chip:#efe9df;--t-sel:#fdeef2;--t-frame:#e2dcd2}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;scroll-padding-top:80px}
body{background:var(--bg);color:var(--text);font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:14.5px;line-height:1.7}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}

/* top bar */
header.top{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:18px;padding:0 22px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);z-index:10}
header.top .logo{font-weight:700;font-size:16px;color:var(--text);white-space:nowrap}
header.top .logo span.k{color:var(--acc)}
header.top .logo small{font-weight:400;color:var(--dim);margin-left:10px;font-size:14px}
header.top .sp{flex:1}
header.top nav a{color:var(--dim);font-size:13px;margin-left:18px}
header.top nav a:hover{color:var(--text);text-decoration:none}
.search{position:relative;width:260px}
.search input{width:100%;font:inherit;font-size:13px;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:5px 10px 5px 28px;outline:none}
.search input:focus{border-color:var(--acc)}
.search::before{content:"›";position:absolute;left:11px;top:4px;color:var(--acc)}
.search kbd{position:absolute;right:8px;top:6px;font:inherit;font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:3px;padding:0 4px;line-height:16px}
.toggle{display:flex;gap:4px}
.toggle button{font:inherit;font-size:12px;background:transparent;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:2px 9px;cursor:pointer}
.toggle button.on{color:var(--acc);border-color:var(--acc)}
.burger{display:none;font:inherit;background:none;border:1px solid var(--line);color:var(--text);border-radius:4px;padding:2px 9px;cursor:pointer}

/* side nav */
nav.side{position:fixed;top:56px;left:0;bottom:0;width:260px;padding:22px 18px 60px 24px;border-right:1px solid var(--line);overflow-y:auto;font-size:13.5px}
nav.side .grp{color:var(--faint);margin:20px 0 6px;font-size:12px;letter-spacing:.06em}
nav.side .grp:first-child{margin-top:0}
nav.side a{display:block;color:var(--dim);padding:2px 0 2px 2ch;border-radius:4px}
nav.side a:hover{color:var(--text);text-decoration:none}
nav.side a.on{color:var(--text)}
nav.side a.on::before{content:"›";color:var(--acc);margin-left:-2ch;width:2ch;display:inline-block}
nav.side a.hide,nav.side .grp.hide{display:none}
nav.side .none{color:var(--faint);display:none}

/* toc */
aside.toc{position:fixed;top:56px;right:0;width:220px;padding:40px 22px;font-size:12.5px}
aside.toc .t{color:var(--faint);margin-bottom:8px;font-size:12px;letter-spacing:.06em}
aside.toc a{display:block;color:var(--dim);padding:2px 0 2px 10px;border-left:1px solid var(--line)}
aside.toc a.on{color:var(--text);border-left-color:var(--acc)}

/* content */
main{margin:56px 220px 0 260px;padding:44px 56px 120px}
article{max-width:880px}
.crumb{color:var(--faint);font-size:12.5px;letter-spacing:.06em;margin-bottom:10px;display:flex;justify-content:space-between}
.crumb .src{color:var(--faint)}.crumb .src:hover{color:var(--acc)}
h1{font-size:34px;line-height:1.2;letter-spacing:-.01em;margin-bottom:14px}
.lead{font-size:17px;color:var(--dim);max-width:68ch;margin-bottom:34px;line-height:1.6}
h2{font-size:20px;margin:46px 0 14px;padding-top:6px}
h3{font-size:15px;margin:28px 0 8px}
p{max-width:72ch;margin-bottom:14px}
ul,ol{max-width:72ch;margin:0 0 16px;padding:0;list-style:none}
ul li,ol li{position:relative;padding-left:3ch;margin-bottom:7px}
ul li::before{content:"·";position:absolute;left:1ch;color:var(--acc)}
ol{counter-reset:n}ol li{counter-increment:n}
ol li::before{content:counter(n);position:absolute;left:0;color:var(--acc);font-weight:700}
code{background:var(--bg2);border-radius:3px;padding:1px .45ch;font-size:.92em}
i{font-style:normal;color:var(--dim)}
.tw{overflow-x:auto;margin:8px 0 22px}
table{border-collapse:collapse;font-size:13.5px;min-width:60%}
th{text-align:left;font-weight:400;color:var(--faint);padding:6px 2.5ch 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 2.5ch 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.note{border-left:2px solid var(--acc);background:var(--bg2);padding:10px 16px;border-radius:0 6px 6px 0;margin:14px 0 20px;max-width:72ch}

/* cards (overview) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin:12px 0 26px}
.card{display:block;border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--bg2);color:var(--text)}
.card:hover{border-color:var(--acc);text-decoration:none}
.card b{display:block;margin-bottom:6px}.card span{color:var(--dim);font-size:13px;line-height:1.55;display:block}

/* do / don't */
.dd{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0 26px}
.dd>div{border:1px solid var(--line);border-radius:10px;padding:14px 18px 6px;border-top:2px solid var(--acc)}
.dd>.dont{border-top-color:var(--err)}
.dd .h{font-weight:700;margin-bottom:8px}
.dd ul li{font-size:13.5px}
.dd .dont ul li::before{content:"×";color:var(--err)}

/* terminal mocks */
figure.ex{margin:14px 0 26px;border:1px solid var(--t-frame);border-radius:10px;overflow:hidden;background:var(--t-bg)}
figure.ex .tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--t-frame);background:color-mix(in srgb,var(--t-bg) 70%,var(--bg2))}
figure.ex .tabs button{font:inherit;font-size:12px;background:none;border:0;color:var(--dim);padding:5px 12px 7px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
figure.ex .tabs button.on{color:var(--text);border-bottom-color:var(--acc)}
figure.ex .scr{overflow-x:auto;padding:16px 18px}
.screen{display:none;font-size:13px;line-height:1.5;color:var(--t-text);width:calc(var(--w) * 1ch);white-space:pre}
.screen.on{display:block}
.screen .ln{min-height:1.5em;white-space:pre}
.screen .ln.raised{background:var(--t-raised)}
.screen .ln.raised2{background:var(--t-raised2)}
figure.ex figcaption{padding:10px 18px 12px;border-top:1px solid var(--t-frame);color:var(--dim);font-size:12.5px;background:color-mix(in srgb,var(--t-bg) 70%,var(--bg2))}
.c-t{color:var(--t-text)}.c-d{color:var(--t-dim)}.c-f{color:var(--t-faint)}.c-r{color:var(--t-rule)}
.c-a{color:var(--t-acc)}.c-ab{color:var(--t-acc);font-weight:700}.c-b{font-weight:700}.c-e{color:var(--t-err)}.c-ok{color:var(--t-ok)}
.c-db{color:var(--t-dim);font-weight:700}
.c-hl{background:var(--t-acc);color:var(--t-bg)}
.c-u{text-decoration:underline;text-decoration-color:var(--t-acc);text-underline-offset:3px}
.c-sel{background:var(--t-sel)}.c-ch{background:var(--t-chip)}.c-eb{color:var(--t-err);font-weight:700}
.gust .g0{color:var(--t-text)}.gust .g1{color:var(--t-text)}.gust .g2{color:var(--t-dim)}.gust .g3{color:var(--t-faint)}
/* NO_COLOR: modifiers only */
.screen.nocolor .c-a,.screen.nocolor .c-ab{color:var(--t-text);font-weight:700}
.screen.nocolor .c-e,.screen.nocolor .c-ok,.screen.nocolor .c-r,.screen.nocolor .c-f{color:var(--t-text)}
.screen.nocolor .c-f,.screen.nocolor .c-d{opacity:.62;color:var(--t-text)}
.screen.nocolor .c-ch,.screen.nocolor .ln.raised,.screen.nocolor .ln.raised2{background:none}
.screen.nocolor .c-hl{background:var(--t-text);color:var(--t-bg)}
.screen.nocolor .gust span{color:var(--t-text)!important}

/* swatches */
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin:12px 0 26px}
.sw>div{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:12.5px}
.sw .chip{height:64px;display:flex;align-items:flex-end;padding:8px 10px;font-size:20px}
.sw .meta{padding:8px 10px 10px}.sw .meta b{display:block}.sw .meta span{color:var(--dim);display:block}

/* prev / next */
.pn{display:flex;justify-content:space-between;gap:14px;margin-top:70px;padding-top:24px;border-top:1px solid var(--line)}
.pn a{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 18px;color:var(--text);min-width:200px}
.pn a:hover{border-color:var(--acc);text-decoration:none}
.pn a span{display:block;color:var(--faint);font-size:12px}
.pn a.r{text-align:right;margin-left:auto}

@media (max-width:1240px){aside.toc{display:none}main{margin-right:0}}
@media (max-width:860px){
  nav.side{transform:translateX(-100%);transition:transform .2s;background:var(--bg);z-index:9;width:280px}
  body.nav nav.side{transform:none}
  main{margin-left:0;padding:34px 20px 100px}
  .burger{display:block}.search{display:none}header.top nav{display:none}
  .dd{grid-template-columns:1fr}h1{font-size:28px}
}
</style>
</head>
<body>
<header class="top">
  <button class="burger" id="burger">≡</button>
  <a class="logo" href="#/@@FIRST@@">bise <span class="k">:*</span><small>design system</small></a>
  <div class="search"><input id="q" placeholder="search" autocomplete="off" spellcheck="false"><kbd>/</kbd></div>
  <div class="sp"></div>
  <nav><a href="/design.md" title="the dense version, for agents">design.md</a><a href="/book/">brand book</a><a href="/screens">screens</a><a href="https://github.com/gvergnaud/bise" target="_blank" rel="noopener">github</a><a href="/">bise.dev</a></nav>
  <div class="toggle"><button data-t="dark" class="on">dark</button><button data-t="light">light</button></div>
</header>
<nav class="side" id="nav">
@@NAV@@
<div class="none" id="none">nothing matches</div>
</nav>
<aside class="toc" id="toc"></aside>
<main id="main">
@@ARTICLES@@
</main>
<script>
(() => {
  const arts = [...document.querySelectorAll("article")], links = [...document.querySelectorAll("nav.side a[data-id]")];
  const toc = document.getElementById("toc");
  function show() {
    const h = decodeURIComponent(location.hash.slice(2) || "@@FIRST@@");
    const [id, anchor] = h.split("--");
    const art = arts.find(a => a.dataset.id === id) || arts[0];
    arts.forEach(a => a.hidden = a !== art);
    links.forEach(l => l.classList.toggle("on", l.dataset.id === art.dataset.id));
    const t = art.querySelector("template.toc");
    toc.innerHTML = t && t.innerHTML.trim() ? '<div class="t">on this page</div>' + t.innerHTML : "";
    document.title = art.querySelector("h1").textContent + " — bise :* design system";
    document.body.classList.remove("nav");
    if (anchor) { const el = document.getElementById(art.dataset.id.replace("/", "-") + "--" + anchor); if (el) { el.scrollIntoView(); return; } }
    window.scrollTo(0, 0);
  }
  addEventListener("hashchange", show); show();
  // toc highlight
  addEventListener("scroll", () => {
    const hs = [...document.querySelectorAll("article:not([hidden]) h2")]; let cur = null;
    for (const h of hs) if (h.getBoundingClientRect().top < 140) cur = h.id;
    toc.querySelectorAll("a").forEach(a => a.classList.toggle("on", a.dataset.t === cur));
  }, { passive: true });
  // tabs
  document.querySelectorAll("figure.ex .tabs").forEach(tb => tb.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    tb.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    tb.parentElement.querySelectorAll(".screen").forEach((s, i) => s.classList.toggle("on", i == b.dataset.i));
  }));
  // search
  const q = document.getElementById("q"), none = document.getElementById("none");
  q.addEventListener("input", () => {
    const v = q.value.trim().toLowerCase(); let any = false;
    links.forEach(l => { const art = arts.find(a => a.dataset.id === l.dataset.id);
      const hit = !v || l.dataset.k.includes(v) || art.textContent.toLowerCase().includes(v);
      l.classList.toggle("hide", !hit); any ||= hit; });
    document.querySelectorAll("nav.side .grp").forEach(g => { let n = g.nextElementSibling, vis = false;
      while (n && !n.classList.contains("grp") && n.id !== "none") { if (!n.classList.contains("hide")) vis = true; n = n.nextElementSibling; }
      g.classList.toggle("hide", !vis); });
    none.style.display = any ? "none" : "block";
  });
  q.addEventListener("keydown", e => { if (e.key === "Enter") { const l = links.find(l => !l.classList.contains("hide")); if (l) { location.hash = l.getAttribute("href"); q.blur(); } } if (e.key === "Escape") { q.value = ""; q.dispatchEvent(new Event("input")); q.blur(); } });
  addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== q && !e.metaKey && !e.ctrlKey) { e.preventDefault(); q.focus(); } });
  // theme
  document.querySelectorAll(".toggle button").forEach(b => b.onclick = () => {
    document.documentElement.dataset.theme = b.dataset.t;
    document.querySelectorAll(".toggle button").forEach(x => x.classList.toggle("on", x === b)); });
  document.getElementById("burger").onclick = () => document.body.classList.toggle("nav");
  // the gust: 5 cells cross left to right, 110 ms a frame, 9 frames; 1 cell breathes
  const R = ["≈","∿","~","·"," "," "," "," "," "], R3 = ["≈","∿","~","·"," "," "," "], B = ["·","~","∿","≈","∿","~"];
  const cls = c => ({ "≈": "g0", "∿": "g1", "~": "g2", "·": "g3" }[c] || "");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let f = 0;
  function tick() {
    document.querySelectorAll("article:not([hidden]) .gust, figure .gust").forEach(g => {
      const n = +g.dataset.n; let s = "";
      if (n === 1) { const c = reduce ? "∿" : B[f % B.length]; s = `<span class="${cls(c)}">${c}</span>`; }
      else { const r = n === 5 ? R : R3; for (let k = 0; k < n; k++) { const c = reduce ? "∿" : r[((f - k) % r.length + r.length) % r.length]; s += `<span class="${cls(c)}">${c}</span>`; } }
      g.innerHTML = s; });
    f++;
  }
  tick(); if (!reduce) setInterval(() => { if (!document.hidden) tick(); }, 110);
})();
</script>
<script>/* notes: ⌥⇧A turns the annotation layer on or off; ?annotate works too. remembered on localhost only; on bise.dev it lasts one tab */
(() => { const K = "bise-annotate", local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname), st = local ? localStorage : sessionStorage,
    load = () => document.head.append(Object.assign(document.createElement("script"), { src: "/annotate.js" }));
  if (!local) localStorage.removeItem(K);
  if (/[?&]annotate\b/.test(location.search)) st.setItem(K, "on");
  if (st.getItem(K) === "on") load();
  addEventListener("keydown", (e) => { if (!(e.altKey && e.shiftKey && e.code === "KeyA")) return; e.preventDefault();
    if (st.getItem(K) === "on") { st.removeItem(K); location.reload(); } else { st.setItem(K, "on"); load(); } });
})();</script>
</body>
</html>
