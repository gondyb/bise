<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" role="img" aria-label="you correct a running agent; the double check shows it read the message; it changes course."><style>text{font-family:ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace;} @media (prefers-reduced-motion: reduce){*{animation:none!important}}@keyframes k1{0%,4.00%{opacity:0}5.50%,36.00%{opacity:1}37.50%,100%{opacity:0}}.k1{opacity:0;animation:k1 10s linear infinite}@keyframes k2{0%,36.00%{opacity:0}37.50%,92.00%{opacity:1}93.50%,100%{opacity:0}}.k2{opacity:0;animation:k2 10s linear infinite}@keyframes k3{0%,14.00%{opacity:0}17.50%,92.00%{opacity:1}95.50%,100%{opacity:0}}.k3{opacity:0;animation:k3 10s linear infinite}@keyframes k4{0%,26.00%{opacity:0}27.00%,92.00%{opacity:1}93.00%,100%{opacity:0}}.k4{opacity:0;animation:k4 10s linear infinite}@keyframes k5{0%,33.00%{opacity:0}36.50%,92.00%{opacity:1}95.50%,100%{opacity:0}}.k5{opacity:0;animation:k5 10s linear infinite}@keyframes k6{0%,42.00%{opacity:0}45.50%,92.00%{opacity:1}95.50%,100%{opacity:0}}.k6{opacity:0;animation:k6 10s linear infinite}@keyframes g{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}.g{animation:g 1.2s infinite}</style><rect width="680" height="230" rx="12" fill="#141211" stroke="#2c2825"/><text x="656" y="30" text-anchor="end" font-size="12" fill="#8f887d">✓ sent · ✓✓ read</text><text class="k1" x="28" y="44" font-size="14" fill="#ece6da" xml:space="preserve"><tspan class="g" fill="#f4a6b0">∿</tspan> sad-404 <tspan fill="#8f887d">· swapping the sad dog for a sun…</tspan></text><text class="k2" x="28" y="44" font-size="14" fill="#ece6da" xml:space="preserve"><tspan class="g" fill="#f4a6b0">∿</tspan> sad-404 <tspan fill="#8f887d">· putting a hat on the dog…</tspan></text><g class="k3"><rect x="14" y="64" width="3" height="19" fill="#f4a6b0"/><text x="28" y="79" font-size="14" font-weight="700" fill="#ece6da" xml:space="preserve">@sad-404 keep the dog. just give it a hat <tspan font-weight="400" fill="#3d3935">✓</tspan></text></g><text class="k4" x="382" y="79" font-size="14" fill="#f4a6b0">✓✓</text><text class="k5" x="28" y="110" font-size="14" fill="#ece6da" xml:space="preserve"><tspan fill="#8f887d">@ sad-404:</tspan> got it. the dog keeps its job. hat on.</text><text class="k6" x="28" y="143" font-size="13" fill="#ece6da" xml:space="preserve"><tspan fill="#8f887d">the correction lands in the running agent. nothing restarts.</tspan></text></svg>
