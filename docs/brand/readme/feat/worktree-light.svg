<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" role="img" aria-label="one agent gets its own worktree for a risky job; the others share the folder; the worktree is cleaned up after."><style>text{font-family:ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace;} @media (prefers-reduced-motion: reduce){*{animation:none!important}}@keyframes k1{0%,5.00%{opacity:0}8.50%,92.00%{opacity:1}95.50%,100%{opacity:0}}.k1{opacity:0;animation:k1 10s linear infinite}@keyframes k2{0%,16.00%{opacity:0}17.50%,50.00%{opacity:1}51.50%,100%{opacity:0}}.k2{opacity:0;animation:k2 10s linear infinite}@keyframes k3{0%,50.00%{opacity:0}51.50%,92.00%{opacity:1}93.50%,100%{opacity:0}}.k3{opacity:0;animation:k3 10s linear infinite}@keyframes k4{0%,19.00%{opacity:0}22.50%,92.00%{opacity:1}95.50%,100%{opacity:0}}.k4{opacity:0;animation:k4 10s linear infinite}@keyframes k5{0%,22.00%{opacity:0}25.50%,92.00%{opacity:1}95.50%,100%{opacity:0}}.k5{opacity:0;animation:k5 10s linear infinite}@keyframes k6{0%,56.00%{opacity:0}59.50%,92.00%{opacity:1}95.50%,100%{opacity:0}}.k6{opacity:0;animation:k6 10s linear infinite}@keyframes g{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}.g{animation:g 1.2s infinite}</style><rect width="680" height="230" rx="12" fill="#f7f4ee" stroke="#e2dbcf"/><text x="656" y="30" text-anchor="end" font-size="12" fill="#77706a">ψ = its own worktree</text><text class="k1" x="28" y="44" font-size="14" fill="#1b1917" xml:space="preserve"><tspan fill="#b8416b">:*</tspan> migrate-db needs its own copy of the repo. the others keep the shared folder.</text><text class="k2" x="28" y="71" font-size="14" fill="#1b1917" xml:space="preserve"><tspan class="g" fill="#b8416b">∿</tspan> migrate-db <tspan fill="#77706a">ψ db-v2 · running the migration on a copy</tspan></text><text class="k3" x="28" y="71" font-size="14" fill="#1b1917" xml:space="preserve"><tspan fill="#b8416b">✓</tspan> migrate-db <tspan fill="#77706a">merged into main. worktree cleaned up.</tspan></text><text class="k4" x="28" y="98" font-size="14" fill="#1b1917" xml:space="preserve"><tspan class="g" fill="#b8416b">∿</tspan> dark-mode <tspan fill="#77706a">· shared folder</tspan></text><text class="k5" x="28" y="125" font-size="14" fill="#1b1917" xml:space="preserve"><tspan class="g" fill="#b8416b">∿</tspan> emoji-csv <tspan fill="#77706a">· shared folder</tspan></text><text class="k6" x="28" y="158" font-size="13" fill="#1b1917" xml:space="preserve"><tspan fill="#77706a">worktrees only when they help. no hundred branches to merge.</tspan></text></svg>
